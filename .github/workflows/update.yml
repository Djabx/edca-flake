name: Update Upstream Flake

on: 
  schedule:
    # Daily at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  update-and-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Update Nixpkgs
        run: nix flake update

      - name: Fetch latest upstream sources
        run: |
          curl -sL https://edcas.de/download/edcas-client-source.tar.gz -o src.tar.gz
          tar -xzf src.tar.gz --strip-components=1 --exclude="*/README.md"
          tar -xzf src.tar.gz --strip-components=1 --transform="s,README.md,README-upstream.md," $(tar -tf src.tar.gz | grep "/README.md$") 2>/dev/null || true
          rm -f src.tar.gz

      - name: Fetch latest 3DMigoto bundle
        run: |
          mkdir -p 3dmigoto
          curl -sL https://edcas.de/download/edcas-client-3dmigoto-x64.zip -o 3dmigoto/edcas-client-3dmigoto-x64.zip

      - name: Check for changes
        id: check_diff
        run: |
          git add .
          if git diff --staged --quiet; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "No upstream changes found."
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "Upstream updates or nixpkgs changes found."
          fi

      - name: Validate build
        if: steps.check_diff.outputs.has_updates == 'true'
        run: |
          echo "Building from source package and running test suite..."
          nix build .#default --no-link

      - name: Extract version and configure tag
        if: steps.check_diff.outputs.has_updates == 'true'
        id: meta
        run: |
          RAW_VERSION=$(nix eval --raw .#packages.x86_64-linux.default.version)
          TAG="v${RAW_VERSION}"

          echo "version=${RAW_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists. Skipping tag creation."
            echo "create_tag=false" >> $GITHUB_OUTPUT
          else
            echo "New version detected (${TAG}). Tag will be created."
            echo "create_tag=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit, Tag and Push
        if: steps.check_diff.outputs.has_updates == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="${{ steps.meta.outputs.tag }}"
          CREATE_TAG="${{ steps.meta.outputs.create_tag }}"

          git commit -m "chore(deps): update upstream edcas to $VERSION and update nixpkgs"
          git push origin main

          if [ "$CREATE_TAG" = "true" ]; then
            git tag -a "$TAG" -m "Release $TAG (automated upstream update)"
            git push origin "$TAG"
          fi
