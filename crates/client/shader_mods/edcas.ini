endif

[ResourceEdcasLightsSpots]
[ResourceEdcasLightsSpots2]
[ResourceEdcasLightsSmall]
[ResourceEdcasLightView]

; Elite's cockpit glass (found by its input COCKPITGLASSMASKS): the ice specks go on right
; after it, on the same glass, while the frame before had a sky (in space the contact texel
; keeps its last value). Only with the frost switched on: EDCAS writes x509 = 0.001 for Canopy
; Frost off (0 reads as full), where the ice shader discards every pixel, and the copy of the
; picture and the cockpit's light before it were made for nothing (PERFORMANCE.md I1, 2026-11-10).
[ShaderOverrideEdcasCanopy]
hash = 953f692f27531387
if $chain_on && $sky_any_last > 0 && (x509 == 0 || x509 > 0.002)
	; the picture before the glass, with the lit cockpit in it, for the frost's light: copied once a
	; frame and shrunk to a sixteenth (edcas_cockpit_light.hlsl)
	pre ResourceEdcasSceneCopy = copy o0
	pre ResourceEdcasCockpitLight = copy_desc o0
	pre run = CustomShaderEdcasCockpitLight
	post run = CustomShaderEdcasCanopyIce
endif

[ResourceEdcasSceneCopy]
max_copies_per_frame = 1

[ResourceEdcasCockpitLight]
format = R16G16B16A16_FLOAT
width_multiply = 0.0625
height_multiply = 0.0625
bind_flags = render_target shader_resource

[CustomShaderEdcasCockpitLight]
vs = edcas_fullscreen_vs.hlsl
ps = edcas_cockpit_light.hlsl
topology = triangle_list
blend = ADD ONE ZERO
alpha = ADD ONE ZERO
mask = 0xf
depth_enable = false
cull = none
scissor_enable = false
ps-t117 = ResourceEdcasSceneCopy
o0 = set_viewport ResourceEdcasCockpitLight
o1 = null
o2 = null
o3 = null
o4 = null
o5 = null
o6 = null
o7 = null
oD = null
draw = 3, 0

[CustomShaderEdcasCanopyIce]
ps = edcas_canopy_ice.hlsl
; dual source: o0 adds the sun's and lamps' light the frost scatters, SV_Target1 scales the light
; already at the glass (the view through it, the cockpit's light on it), see the shader. Dual-source
; blending takes render target 0 alone, so the others are unbound for the draw.
blend = ADD ONE SRC1_COLOR
alpha = ADD ZERO ONE
o1 = null
o2 = null
o3 = null
ps-t112 = ResourceEdcasCanopyContact
ps-t113 = ResourceEdcasCanopyFrost
; the lit cockpit around the frost (see the shader) and Elite's lamps (edcas_lamps.hlsl)
ps-t117 = ResourceEdcasCockpitLight
ps-t114 = ResourceEdcasLightsSpots
ps-t115 = ResourceEdcasLightsSpots2
ps-t116 = ResourceEdcasLightsSmall
ps-cb13 = ResourceEdcasLightView
x510 = $lights_spots
y510 = $lights_spots2
z510 = $lights_small
draw = from_caller

; Each frame starts counting Elite's sky draws anew (see [ShaderOverrideEdcasSky]).
[Present]
; Two seconds or so without any sky draw (in space, after a jump) clear the frost, the cloud
; measure and the fog's floor: they kept the last planet's, and frost came back at full on the
; next planet before it sublimated (code review, 2026-10-28).
if $sky_seen + $sky_full + $sky_small + $sky_ups == 0
	$no_sky = $no_sky + 1
else
	$no_sky = 0
endif
if $no_sky == 240
	clear = ResourceEdcasCanopyContact
	clear = ResourceEdcasCanopyFrost
	clear = ResourceEdcasGroundRef
	clear = ResourceEdcasSunRef
endif
; The sky chain runs only while it has something to draw (2026-11-10: with every effect at 0 it
; still copied the picture twice a frame and ran its seven passes over nothing). It stays on for
; ten seconds after the last of clouds, fog and dust went to 0: the frost on the canopy needs
; five of them to sublimate. Then the frost, the cloud measure and the fog's floor are cleared,
; as after two seconds without a sky, so that nothing stale shows when the chain comes back.
if x503 > 0 || x507 > 0 || x515 > 0 || x522 > 0
	$chain_until = time + 10
endif
if time < $chain_until
	$chain_on = 1
	; The frame's length for the memories of the next frame (y525, edcas_memory.hlsl): only while the
	; chain runs, so that nothing is written with every effect at 0.
	y525 = time - $last_time
else
	if $chain_on == 1
		clear = ResourceEdcasCanopyContact
		clear = ResourceEdcasCanopyFrost
		clear = ResourceEdcasGroundRef
		clear = ResourceEdcasSunRef
	endif
	$chain_on = 0
endif
; the linear depth is this frame's or none
$lin_depth = 0
; the lights are copied anew every frame
$lights_spots = 0
$lights_spots2 = 0
$lights_small = 0
; last frame's counts, for the debug overlay and the next frame's prediction: an eye's, as
; CommandListEdcasEyeDone kept them, or, in a frame whose sky pass never reached its anchor, the
; frame's
$sky_any_last = $sky_seen + $sky_full + $sky_small + $sky_ups
if $sky_seen == 0
	$dbg_small = $sky_small
	$dbg_full = $sky_full
	$dbg_ups = $sky_ups
	$dbg_done = $sky_done
	$dbg_later = $sky_later
	$sky_last = $sky_full
endif
$sky_seen = 0
$sky_full = 0
$sky_small = 0
$sky_ups = 0
$sky_done = 0
$sky_later = 0
$terrain_cleared = 0
; `time` at this frame's end, for the next frame's length (y525 above).
$last_time = time
