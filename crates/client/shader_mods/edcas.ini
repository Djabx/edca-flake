; EDCAS planet ground tint for 3DMigoto (installed by scripts/ed-shader/install.py).
;
; ShaderFixes/7ce82fabb300f52e-ps.txt is the game's ground shader with a tint on its colour.
; EDCAS writes the tint for the planet you are at into ShaderFixes/edcas_params.txt:
;   x = strength, y z w = colour; the patched 3DMigoto ([System] params_file) applies it live.
;
; No value goes to the GPU on Present: Elite renders from several threads, and uploading the
; IniParams there froze it. Values from the params file go up with the first command list run
; for a draw.

[Constants]
; The ground type (ground_detail_tex.py TYPES) of the body EDCAS says the commander is at: 0 sand,
; 1 regolith, 2 ice, 3 frost, 4 rocky ice, 5 lava. A variable, not an IniParam: the params file
; fades IniParams over seconds, and a slice number must not run through the others on the way.
global $ground_type = 0
; Elite's sky draws this frame and last frame (see [ShaderOverrideEdcasSky]): full-size draws,
; small-buffer draws, upsamples of the small buffer; whether the cloud chain has run this frame
; (1 at a full-size draw, 2 after an upsample) and how many bands were redrawn after it
global $sky_full = 0
global $sky_last = 0
global $sky_small = 0
global $sky_ups = 0
global $sky_done = 0
global $sky_later = 0
global $sky_any_last = 0
global $no_sky = 0
; last frame's, for the debug overlay (edcas_debug_overlay.hlsl, y511 = 11)
global $dbg_small = 0
global $dbg_full = 0
global $dbg_ups = 0
global $dbg_done = 0
global $dbg_later = 0
; the terrain mask is cleared once a frame, at the first ground draw (see CommandListEdcasTerrainMask)
global $terrain_cleared = 0
; Whether the sky chain has anything to draw: 1 while clouds (x503), fog (x507) or dust (x515) are
; set and for ten seconds after, the seconds until which it is ([Present]). At 0 nothing of the
; chain runs: no copies of the picture, of the sky pass's constants or of the lamps, no passes.
global $chain_on = 1
global $chain_until = 0
; how many lights Elite's light-volume draws had this frame (see [ShaderOverrideEdcasLightsSpots])
global $lights_spots = 0
global $lights_spots2 = 0
global $lights_small = 0
; Clouds (edcas_clouds.hlsl); the params file can change them while the game runs:
;   x503 coverage 0..1 (0 = none)        y503 clouds across the visible sky (larger = smaller)
;   z503 height 0..1 up to the ceiling  w503 brightness (reflectance; 1 = bright ice)
;   x504 opacity 0..1                    y504 streakiness 0..1 (0 = puffy, 1 = cirrus streaks)
;   w504 iridescence 0..1
;   z505 thickness 0..1 (0 = thin sheet; above 0 a ray-marched slab, x504 = opacity through all of it)
x503 = 0.5
y503 = 8
z503 = 0.5
w503 = 1
x504 = 0.6
y504 = 0.8
w504 = 0
z505 = 0
; y506 the clouds' ceiling, a share of the atmosphere (0 = 1); z506 how far down the tops round off, a share of the slab (0 = 0.35)
y506 = 0
z506 = 0
; w506 how fast the clouds darken after sunset (0 = 4; larger = sooner)
w506 = 0
; ground fog, see edcas_fog.hlsl: x507 density (0 = none), y507 depth in metres over the lowest ground
; in view (0 = 800), z507 brightness (0 = 0.6), w507 the planet's radius in metres (from EDCAS)
x507 = 0
y507 = 0
z507 = 0
w507 = 0
; x508 soft, frayed cloud edges (0 = 0.5; larger = softer), y508 how far up the bases fade in (0 = 0.35)
x508 = 0
y508 = 0
; frost on the canopy in cloud and fog, see edcas_canopy_ice.hlsl: x509 strength (0 = 1)
x509 = 0
; Elite's lamps in cloud and fog, see edcas_lights.hlsl: w509 a share of the physical glow (0 = none;
; EDCAS's Lamp Glow in Fog), z509 = 5 lamp markers instead (a debug aid)
w509 = 0.1
z509 = 0
; wind-blown dust, see edcas_dust.hlsl: x515 strength (0 = none), y515 wind in m/s (0 = 8), w515 the
; planet's radius in metres (from EDCAS), x516 y516 z516 its colour (0 = Mars dust's ochre), w516 = 1 a
; debug view of the terrain mask (see the shader); z515 is the time, set in [CustomShaderEdcasCloudsFinal]
x515 = 0
y515 = 0
w515 = 0
x516 = 0
y516 = 0
z516 = 0
w516 = 0
; the dust over the ground: x518 how many times as bright as the lit ground under it (0 = 1.2), y518
; how far its colour goes towards white (0 = none), z518 times as thick (0 = 4), w518 the far drift
; times as thick (0 = 1), to tune in game (edcas_dust.hlsl)
x518 = 0
y518 = 0
z518 = 0
w518 = 0
; x519 how far the far drift reaches, metres (0 = 15000; edcas_dust.hlsl)
x519 = 0
; Ground detail (ground_tint.py, detail): x511 colour and z511 relief strength, w511 the
; distance the small layers fade out at, x512 to w512 the strength of the patches, pebbles,
; ripples and grain, x513 of the large patches, y513 and z513 the relief of the 2 m and 8 m
; layers, w513 of the pebbles (0 = 1 each); y511 = 1 to 4 debug views (chunk tiles, planet
; stripes, normal, relief tilt), y511 = 5 the relief's sign test (flat dunes = right), y511 = 6 the crust
; mask, 7 and 8 the sparkle, y511 = 9 the hex-tiling's cells (each a hashed grey), y511 = 10 the parallax march's depth (grey), y511 = 11 the
; sky chain's debug overlay (edcas_debug_overlay.hlsl: sky draw counts, chain runs, cloud values); y514 < 0 switches the
; hex-tiling of the 8, 2 and 0.5 m layers and the stones off (plain tiling, to compare live); x514 is the
; ground type, copied from $ground_type when the ground is drawn.
; z514: the ice ground's parallax occlusion mapping with self-shadowing (experiment, ground_tint.py `pom`): 0 = on (the default), under 0 = off,
; above 0 a factor on its depth; live: put `z514 = -1` in edcas_params.txt and back to 0 to compare and see the frame rate.
; w514: the snow as a sheet (ground_tint.py `pom_tap`): 0 = on (the default: the snow is a layer 2.5 cm above the ice, the churn on top; the ice stays the flat fractal), under 0 = off,
; above 0 a factor on its height; live in edcas_params.txt, no restart.
; 0.0001, not 0 (which means 1): with no word from EDCAS (it isn't running, or the body is
; unknown) the detail stays off, or every body would get full-strength sand ($ground_type 0).
x511 = 0.0001
y511 = 0
z511 = 0.0001
w511 = 0
x512 = 0
y512 = 0
z512 = 0
w512 = 0
x513 = 0
y513 = 0
z513 = 0
w513 = 0
y514 = 0
z514 = 0
w514 = 0
