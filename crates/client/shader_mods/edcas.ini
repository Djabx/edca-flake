; The terrain mask: the ground shaders also write their distance from the camera (metres) to o4
; (ground_tint.py mask), and the dust takes a pixel for ground only where it is the depth
; buffer's: the depth buffer also holds the ships and the SRV, drawn after the ground, and the
; dust's ground sheet lay on a parked ship's hull (2026-10-29). Cleared to 0 (no ground) at the
; frame's first ground draw. "pre" and "post" on every line: called as "run", a line without
; a prefix would run both before and after the draw.
; Only the main view's ground (a full-size target, as the sky's eyes): Elite's 256 x 256 view draws
; ground too (50fd337fd22daec6, its own G-buffer), and where its ground came first the mask was made
; at its size, the main view's bind of it did not take, and that eye's dust found no ground, with
; that view's cb2 for the camera's place. A VR player, 2026-11-20: the ground dust right in the right
; eye and distorted in the left, the first drawn (ini_sim.py mask_from_the_main_view_only).
[CommandListEdcasTerrainMask]
if rt_width >= 1280
	if $terrain_cleared == 0
		pre ResourceEdcasTerrainDist = copy_desc o0
		pre clear = ResourceEdcasTerrainDist
		pre ResourceEdcasGroundCb2 = copy ps-cb2
		pre $terrain_cleared = 1
	endif
	pre o4 = ResourceEdcasTerrainDist
	post o4 = null
endif

; One float: the distance (at most 60 km, ground_tint.py MASK_FAR_M). The sun pass reads it too, for the
; sunset on the ground ([CommandListEdcasSunset], star_light.py sunset_block). From client 0.43.151 to
; 0.43.234 it was two half floats, the second the sunset as the ground shaders worked it out: with a row
; of theirs that is not the sun's in every frame, so the ground blinked dark about once a second
; (2026-11-19).
[ResourceEdcasTerrainDist]
format = R32_FLOAT
bind_flags = render_target shader_resource

; The ground pass's cb2 at the frame's first ground draw: the sun pass takes the planet's centre from it
; (row 12, for the sunset: star_light.py sunset_block), and the dust the camera's exact place
; (rows 13 and 14; edcas_dust.hlsl camPlace). The sky pass has that place only rounded to
; some centimetres up to a quarter of a metre, and the dust's streamers, a metre apart, jumped
; with every step the commander took (2026-11-17).
[ResourceEdcasGroundCb2]

; The sun pass's cb2 at its last draw ([CommandListEdcasSunset]), for the ground shaders of the next frame.
[ResourceEdcasSunCb2]

; The picture as Elite lit it, at the sky's last full-size draw (a copy of its o0): the dust
; is lit as bright as the ground under it, so dark in shade (edcas_dust.hlsl).
[ResourceEdcasSceneLit]

