; Runs when the ground is drawn: x514 is the ground type. All three ground shaders get the detail textures (ground_detail_tex.py), arrays with a
; slice per ground type: colour at t110 (R G) and t113 (B A), relief slopes at t111 (2 m layer)
; and t114 (8 m layer), stones' slopes at t112 and shade at t115, the snow's height map's slopes at t116 and
; its height at t117 (one tile of 4 m, two identical slices: arrays like the others).
[ShaderOverrideEdcasGround]
hash = 7ce82fabb300f52e
