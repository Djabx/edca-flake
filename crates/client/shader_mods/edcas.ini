; Elite's cockpit glass (found by its input COCKPITGLASSMASKS): the ice specks go on right
; after it, on the same glass, while the frame before had a sky (in space the contact texel
; keeps its last value). Only with the frost switched on: EDCAS writes x509 = 0.001 for Canopy
; Frost off (0 reads as full), where the ice shader discards every pixel, and the copy of the
; picture and the cockpit's light before it were made for nothing (PERFORMANCE.md I1, 2026-11-10).
[ShaderOverrideEdcasCanopy]
hash = 953f692f27531387
if $chain_on && $sky_any_last > 0 && (x509 == 0 || x509 > 0.002)
	; the picture before the glass, with the lit cockpit in it, for the frost's light: copied once a
	; frame and shrunk to a sixteenth (edcas_cockpit_light.hlsl)
	pre ResourceEdcasSceneCopy = copy o0
	pre ResourceEdcasCockpitLight = copy_desc o0
	pre run = CustomShaderEdcasCockpitLight
	post run = CustomShaderEdcasCanopyIce
endif

[ResourceEdcasSceneCopy]
max_copies_per_frame = 1

[ResourceEdcasCockpitLight]
format = R16G16B16A16_FLOAT
width_multiply = 0.0625
height_multiply = 0.0625
bind_flags = render_target shader_resource

