; Elite's local lights (ship's lights, suit torch, lamps): after each of its light-volume draws the
; draw's light records (vs-t0, the view's range), its light count and its view constants (vs-cb2) are
; copied, for the light they scatter in cloud and fog (edcas_lights.hlsl). Copies only: a capture
; shader drawing here washed the main menu's hangar out (2026-10-28). The draws come before the
; sky in the frame; [Present] sets the counts back to 0.
; The clock for the witch-space rainbow (and the dust): z515 = seconds since the game started, set at the sun
; pass, which draws every frame, in witch space too; the cloud chain sets it as well, to the same clock.
; The sun pass also gets the terrain mask (t118: the ground's distance) and the ground pass's cb2 (cb12: its
; row 12 is the planet's centre from the camera; Elite's shaders use cb0 to cb5), for the sunset on the
; ground, which our copy of the pass works out with its own light direction (star_light.py sunset_block),
; in a frame that drew ground only: in space the two are still the last planet's.
[ShaderOverrideEdcasSunClock]
hash = e569985b041c66db
z515 = time
run = CommandListEdcasSunset

[ShaderOverrideEdcasSunClock2]
hash = 968737c608cc1c08
z515 = time
run = CommandListEdcasSunset

[CommandListEdcasSunset]
if $terrain_cleared == 1
	pre ps-t118 = ResourceEdcasTerrainDist
	pre ps-cb12 = ResourceEdcasGroundCb2
else
	pre ps-t118 = null
endif
post ps-t118 = null
post ps-cb12 = null
; The pass's cb2 for the next frame's ground shaders (cb11: row 42 is the direction the sunlight travels,
; for the relief's shadows, ground_tint.py SUN_COPY). The frame's cb1[4] is not the sun's in every frame of
; the ground pass (2026-11-19); this pass's own row is, and consecutive draws of it had the same direction
; in the game (test of 2026-11-19, and ed_frame39017). A frame old: the axes are the planet's.
post ResourceEdcasSunCb2 = copy ps-cb2
; Elite's shadow of the sun (the sun pass's t3: 1 in the sun, 0 in shadow), for the ground probe
; (edcas_ground_grid.hlsl, edcas_clouds.hlsl sunShade) and through it the fog's light (edcas_fog.hlsl):
; only while there is fog. A copy, not a reference: the chain runs after the sky, and what Elite does
; with the texture until then is not known.
if $chain_on && x507 > 0
	pre ResourceEdcasSunShade = copy ps-t3
endif
; The clouds' shadow (edcas_cloud_shade.hlsl), worked out on this draw right before it and read by our
; copy of the sun pass at t114 (star_light.py cloud_block; unbound reads as 0, no shadow): while the
; player has it on (z502), there is a slab of cloud (x503, z505), this frame's linear depth is at hand
; and the sky was drawn in the frame before (the planet's constants are that frame's). The buffer is a
; twin of the pass's own target, so a pixel of the one is that pixel of the other at any render scale.
if $chain_on && z502 > 0 && x503 > 0 && z505 > 0 && $lin_depth == 1 && $sky_any_last > 0 && rt_width >= 1280
	pre ResourceEdcasCloudShade = copy_desc o0
	pre run = CustomShaderEdcasCloudShade
	pre ps-t115 = null
	pre ps-t114 = ResourceEdcasCloudShade
else
	pre ps-t114 = null
endif
post ps-t114 = null

