; Elite's atmosphere pass (sky and haze over the ground), and the cloud chain hung on it.
[ShaderOverrideEdcasSky]
hash = 236d6421041d3892
; Elite draws the sky into a small buffer first (430x180 at 3440x1440), then a band of view
; directions at a time: marks the band in the stencil, upsamples the small buffer onto the picture
; there (d8d3d17a, [ShaderOverrideEdcasSkyUpsample]) and redraws at full size where upsampling
; fails (frame analysis, 2026-10-26). Clouds drawn along both paths never matched: faint lines
; along the edges between them. So the clouds go on once, over the whole picture, after the
; full-size draw that last frame's count says is the frame's last ([Present] keeps the count;
; starting at the small draw instead flickered, Elite skips the small buffer in some frames).
; Since 2026-11-08 that count is a guess the frame corrects, not a condition the clouds hang on
; (a Windows tester's clouds vanished with the ship at rest; the chain can only have stopped
; running): a band Elite draws after the chain gets the picture under the clouds back first
; (CommandListEdcasSkyPre), then its new sky, then the clouds again on that band alone
; (CommandListEdcasBandAgain); and a frame with no full-size draw at all runs the chain after
; Elite's upsample, over a full-screen triangle (CommandListEdcasChainFull).
pre run = CommandListEdcasSkyPre
post run = CommandListEdcasSky

; Its two variants, which Elite uses in some views (looking up in head look lost the clouds).
[ShaderOverrideEdcasSkyB]
hash = 7932556525410d85
pre run = CommandListEdcasSkyPre
post run = CommandListEdcasSky

[ShaderOverrideEdcasSkyC]
hash = 8c9b2131f7ef329f
pre run = CommandListEdcasSkyPre
post run = CommandListEdcasSky

; Elite's upsample of the small sky buffer onto the picture, once per band.
;
; Elite's first draw after the sky pass that reads the lit picture (100375782ec8164b, right after
; the last sky draw in both frame analyses of 2026-10-28): the frame's last chance for the clouds.
; A frame in which Elite drew fewer full-size sky bands than the frame before never reached the
; predicted draw, and went out without clouds: a blink per such frame (a tester's "flickering",
; 2026-11-08). Here the chain runs over the whole picture, as after the upsample, into the sky
; pass's render target (ResourceEdcasScene, referenced at every sky draw).
[ShaderOverrideEdcasAfterSky]
hash = 100375782ec8164b
pre run = CommandListEdcasSkyLate

[CommandListEdcasSkyLate]
if $chain_on && $sky_done == 0 && $sky_full + $sky_small + $sky_ups > 0
	pre $sky_done = 3
	pre ResourceEdcasCloudHalf = copy_desc ResourceEdcasScene
	pre clear = ResourceEdcasCloudHalf
	pre ResourceEdcasSceneLit = copy ResourceEdcasScene
	pre run = CustomShaderEdcasGroundGridFull
	pre run = CustomShaderEdcasGroundRefFull
	pre run = CustomShaderEdcasCanopyContactFull
	pre run = CustomShaderEdcasCanopyFrostFull
	pre run = CustomShaderEdcasCloudsFinalFull
	pre x525 = 0
	pre run = CustomShaderEdcasCloudsCompositeLate
endif

[ShaderOverrideEdcasSkyUpsample]
hash = d8d3d17af211e0a6
pre run = CommandListEdcasSkyPre
post run = CommandListEdcasSkyUpsample

; Before a sky draw or a sky upsample into the picture. Once the chain has run this frame, the
; band about to be drawn gets the picture under the clouds back (edcas_copy.hlsl, limited to the
; band by the draw's own stencil test), and ResourceEdcasBandMask marks the band for the steps
; after the draw, which must not lean on what the draw leaves in the stencil. "pre" on every line
; of these lists: called from a pre or post run, a command list runs its pre and post parts
; together, and a line without a prefix would be in both, running twice.
[CommandListEdcasSkyPre]
if $chain_on && rt_width >= 1280
	pre ResourceEdcasScene = ref o0
	if $sky_done > 0
		pre ResourceEdcasBandMask = copy_desc o0
		pre clear = ResourceEdcasBandMask
		pre x525 = 0
		pre run = CustomShaderEdcasRestore
	endif
endif

; After each of the three sky shaders.
[CommandListEdcasSky]
; what the chain needs of the pass for a run without its geometry (edcas_sky_vs.hlsl)
if $chain_on
	pre ResourceEdcasSkyCb1 = copy ps-cb1
	pre ResourceEdcasSkyVsCb0 = copy vs-cb0
	pre ResourceEdcasSkyDepth = ref ps-t0
	pre ResourceEdcasSkyDepthAlt = ref ps-t4
endif
; The draws are counted with the chain off too: the count is what it starts from when it comes on.
if rt_width >= 1280
	pre $sky_full = $sky_full + 1
	if $chain_on
		if $sky_done == 0
			if $sky_full == $sky_last
				pre run = CommandListEdcasChain
			endif
		else
			pre run = CommandListEdcasBandAgain
		endif
	endif
	pre run = CommandListEdcasOverlay
else
	pre $sky_small = $sky_small + 1
endif

; After Elite's upsample.
[CommandListEdcasSkyUpsample]
if rt_width >= 1280
	pre $sky_ups = $sky_ups + 1
	if $chain_on
		if $sky_done == 0
			if $sky_last == 0
				pre run = CommandListEdcasChainFull
			endif
		else
			pre run = CommandListEdcasBandAgain
		endif
	endif
	pre run = CommandListEdcasOverlay
endif

; The chain on the sky draw's geometry (draw = from_caller: its vertex shader, constants, depth).
[CommandListEdcasChain]
pre $sky_done = 1
pre ResourceEdcasCloudHalf = copy_desc o0
pre clear = ResourceEdcasCloudHalf
; the lit picture, for the light under the dust (edcas_dust.hlsl) and as the picture under the
; clouds (CommandListEdcasSkyPre): a copy, as the canopy's; read through a reference the values
; were far too small and the dust dark (2026-10-29)
pre ResourceEdcasSceneLit = copy o0
pre run = CustomShaderEdcasGroundGrid
pre run = CustomShaderEdcasGroundRef
pre run = CustomShaderEdcasCanopyContact
pre run = CustomShaderEdcasCanopyFrost
pre run = CustomShaderEdcasCloudsFinal
pre x525 = 0
pre run = CustomShaderEdcasCloudsComposite

; The chain without a sky draw to run on: over a full-screen triangle (edcas_sky_vs.hlsl), with
; the constants and depth buffers copied at the frame's sky draws (the small draw's at least).
[CommandListEdcasChainFull]
pre $sky_done = 2
pre ResourceEdcasCloudHalf = copy_desc o0
pre clear = ResourceEdcasCloudHalf
pre ResourceEdcasSceneLit = copy o0
pre run = CustomShaderEdcasGroundGridFull
pre run = CustomShaderEdcasGroundRefFull
pre run = CustomShaderEdcasCanopyContactFull
pre run = CustomShaderEdcasCanopyFrostFull
pre run = CustomShaderEdcasCloudsFinalFull
pre x525 = 0
pre run = CustomShaderEdcasCloudsCompositeFull

; A band drawn after the chain: the clean copy takes the band's new sky, then the clouds go on
; it again, both within ResourceEdcasBandMask (x525 = 1).
[CommandListEdcasBandAgain]
pre $sky_later = $sky_later + 1
pre x525 = 1
pre run = CustomShaderEdcasCleanUpdate
pre run = CustomShaderEdcasCloudsCompositeFull
pre x525 = 0

; The debug overlay (edcas_debug_overlay.hlsl), drawn into the picture after every sky draw and
; upsample when y511 = 11: last frame's counts go to IniParams rows 523 and 524 for it.
[CommandListEdcasOverlay]
if y511 == 11
	pre x523 = $dbg_small
	pre y523 = $dbg_full
	pre z523 = $dbg_ups
	pre w523 = $dbg_done
	pre x524 = $dbg_later
	pre y524 = $no_sky
	pre run = CustomShaderEdcasOverlay
endif

