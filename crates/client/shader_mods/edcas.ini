alpha = ADD ONE ZERO
mask = 0xf
depth_enable = false
cull = none
scissor_enable = false
ps-t117 = ResourceEdcasSceneCopy
o0 = set_viewport ResourceEdcasCockpitLight
o1 = null
o2 = null
o3 = null
o4 = null
o5 = null
o6 = null
o7 = null
oD = null
draw = 3, 0

[CustomShaderEdcasCanopyIce]
ps = edcas_canopy_ice.hlsl
; dual source: o0 adds the sun's and lamps' light the frost scatters, SV_Target1 scales the light
; already at the glass (the view through it, the cockpit's light on it), see the shader. Dual-source
; blending takes render target 0 alone, so the others are unbound for the draw.
blend = ADD ONE SRC1_COLOR
alpha = ADD ZERO ONE
o1 = null
o2 = null
o3 = null
ps-t112 = ResourceEdcasCanopyContact
ps-t113 = ResourceEdcasCanopyFrost
; the lit cockpit around the frost (see the shader) and Elite's lamps (edcas_lamps.hlsl)
ps-t117 = ResourceEdcasCockpitLight
ps-t114 = ResourceEdcasLightsSpots
ps-t115 = ResourceEdcasLightsSpots2
ps-t116 = ResourceEdcasLightsSmall
ps-cb13 = ResourceEdcasLightView
x510 = $lights_spots
y510 = $lights_spots2
z510 = $lights_small
draw = from_caller

; Each frame starts counting Elite's sky draws anew (see [ShaderOverrideEdcasSky]).
[Present]
; Two seconds or so without any sky draw (in space, after a jump) clear the frost, the cloud
; measure and the fog's floor: they kept the last planet's, and frost came back at full on the
; next planet before it sublimated (code review, 2026-10-28).
if $sky_full + $sky_small + $sky_ups == 0
	$no_sky = $no_sky + 1
else
	$no_sky = 0
endif
if $no_sky == 240
	clear = ResourceEdcasCanopyContact
	clear = ResourceEdcasCanopyFrost
	clear = ResourceEdcasGroundRef
endif
; The sky chain runs only while it has something to draw (2026-11-10: with every effect at 0 it
; still copied the picture twice a frame and ran its seven passes over nothing). It stays on for
; ten seconds after the last of clouds, fog and dust went to 0: the frost on the canopy needs
; five of them to sublimate. Then the frost, the cloud measure and the fog's floor are cleared,
; as after two seconds without a sky, so that nothing stale shows when the chain comes back.
if x503 > 0 || x507 > 0 || x515 > 0
	$chain_until = time + 10
endif
if time < $chain_until
	$chain_on = 1
else
	if $chain_on == 1
		clear = ResourceEdcasCanopyContact
		clear = ResourceEdcasCanopyFrost
		clear = ResourceEdcasGroundRef
	endif
	$chain_on = 0
endif
; the lights are copied anew every frame
$lights_spots = 0
$lights_spots2 = 0
$lights_small = 0
; last frame's counts, for the debug overlay
$dbg_small = $sky_small
$dbg_full = $sky_full
$dbg_ups = $sky_ups
$dbg_done = $sky_done
$dbg_later = $sky_later
$sky_any_last = $sky_full + $sky_small + $sky_ups
$sky_last = $sky_full
$sky_full = 0
$sky_small = 0
$sky_ups = 0
$sky_done = 0
$sky_later = 0
$terrain_cleared = 0
