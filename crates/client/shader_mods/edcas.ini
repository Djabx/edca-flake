; The terrain mask: the ground shaders also write their distance from the camera (metres) to o4
; (ground_tint.py mask), and the dust takes a pixel for ground only where it is the depth
; buffer's: the depth buffer also holds the ships and the SRV, drawn after the ground, and the
; dust's ground sheet lay on a parked ship's hull (2026-10-29). Cleared to 0 (no ground) at the
; frame's first ground draw. "pre" and "post" on every line: called as "run", a line without
; a prefix would run both before and after the draw.
[CommandListEdcasTerrainMask]
if $terrain_cleared == 0
	pre ResourceEdcasTerrainDist = copy_desc o0
	pre clear = ResourceEdcasTerrainDist
	pre $terrain_cleared = 1
endif
pre o4 = ResourceEdcasTerrainDist
post o4 = null

[ResourceEdcasTerrainDist]
format = R32_FLOAT
bind_flags = render_target shader_resource

; The picture as Elite lit it, at the sky's last full-size draw (a copy of its o0): the dust
; is lit as bright as the ground under it, so dark in shade (edcas_dust.hlsl).
[ResourceEdcasSceneLit]

[ResourceEdcasGroundColourA]
filename = edcas_ground_colour_a.dds

[ResourceEdcasGroundColourB]
